# TeleTransport configuration, shared by the API and the CLI.
#
# Every key is optional: anything missing falls back to the default in the code.
# The file is looked up in this order, first match wins:
#   1. the path in the TRAVEL_RANKER_CONFIG environment variable
#   2. ./travel_ranker.toml
#   3. ~/.config/travel_ranker.toml

# Notes printed before a search. A plain string applies to flights; a table can
# target "trains", "flights" or "both".
[reminders]
# voucher = { text = "Use the hotel voucher before it expires", target = "both" }


[trains]
min_price = 20.0          # EUR: ignore solutions cheaper than this
max_per_day = 120         # solutions kept per day and per route
page_size = 40            # solutions requested per page (higher = fewer calls)

# LeFrecce sometimes answers with empty or repeated pages before its results
# are ready. These bound the polling; they do not change what is found.
poll_empty_retries = 6
poll_dup_retries = 4
poll_sleep_base = 0.6     # seconds, base of the jittered backoff
scan_cap_mult = 25        # stop after max(300, max_per_day * scan_cap_mult) solutions scanned
api_timeout_ms = 45000
api_retries = 6

# adjusted_cost = price
#               + duration_hours * time_value_eur_per_hour
#               + hours before early_departure_ref_hour * early_departure_penalty_eur_per_hour
#               + hours after late_arrival_start_hour * late_arrival_penalty_eur_per_hour
#               + changes * change_penalty_eur
[trains.scoring]
time_value_eur_per_hour = 20.0
early_departure_ref_hour = 9
early_departure_penalty_eur_per_hour = 20.0
late_arrival_start_hour = 22
overnight_end_hour = 5    # arrivals from midnight to this hour keep counting as late
late_arrival_penalty_eur_per_hour = 15.0
change_penalty_eur = 5.0


[flights]
currency = "EUR"
hl = "it"                 # Google Flights interface language
gl = "it"                 # Google Flights country

deep_search = true        # slower, closer to what the Google Flights site shows
show_hidden = true        # include flights Google hides by default
no_cache = false          # true = always ask SerpApi, ignoring its cache
dedup = true              # drop rows identical in times, duration and price

min_price = 3             # EUR: ignore prices below this, usually parsing noise
top_flights = 80          # flights kept per route and day

# Same shape as trains, with connections in place of changes.
[flights.scoring]
time_value_eur_per_hour = 20.0
early_departure_ref_hour = 9
early_departure_penalty_eur_per_hour = 20.0
late_arrival_start_hour = 22
overnight_end_hour = 5
late_arrival_penalty_eur_per_hour = 15.0
connection_penalty_eur = 5.0
companions_time_value_eur_per_hour = 8.0

# Cost of getting to or from an airport, added to every flight that uses it.
# Drive hours are priced at the time values above.
[flights.airport_extras]
# BDS = { fuel_eur = 30.0, personal_drive_hours = 1.5, companions_drive_hours = 3.0 }


# Defaults the web app starts from. Train stations must use their Italian
# names, since that is what the LeFrecce station lookup matches.
[ui.trains]
default_origin = "Milano Centrale"
default_destination = "Roma Termini"

[ui.flights]
default_origin = "Zurich"
default_destination = "Rome"

# Substring rules from place names to IATA codes, tried in order: put specific
# airports before the city that contains them. A city with several airports
# lists them all, since Google Flights ignores metropolitan codes such as ROM.
[ui.flights.iata_mapping]
zurigo = "ZRH"
zurich = "ZRH"
bari = "BRI"
brindisi = "BDS"
