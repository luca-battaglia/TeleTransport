name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "core/**"
      - "requirements.txt"
      - "travel_ranker.toml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      # A user that owns the code and may restart the service, and nothing else:
      # the service itself runs as another user, which cannot write the code.
      VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
      APP_DIR: /opt/teletransport
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # The server's host key is pinned, so the deploy refuses to talk to
          # anything else answering on that address.
          printf '%s %s\n' "$VPS_HOST" "$VPS_HOST_KEY" > ~/.ssh/known_hosts

      - name: Sync code
        run: |
          target="$VPS_USERNAME@$VPS_HOST:$APP_DIR"
          rsync -az --delete --exclude '__pycache__' backend/ "$target/backend/"
          rsync -az --delete --exclude '__pycache__' core/ "$target/core/"
          rsync -az requirements.txt travel_ranker.toml "$target/"

      - name: Install dependencies and restart
        run: |
          ssh "$VPS_USERNAME@$VPS_HOST" "APP_DIR=$APP_DIR bash -s" <<'EOF'
            set -eu
            cd "$APP_DIR"
            venv/bin/pip install --quiet -r requirements.txt
            # A new Playwright release needs its own browser build; a no-op otherwise.
            PLAYWRIGHT_BROWSERS_PATH="$APP_DIR/ms-playwright" venv/bin/playwright install chromium
            sudo systemctl restart teletransport
            for _ in $(seq 1 15); do
              curl -fsS http://127.0.0.1:8000/api/health && exit 0
              sleep 2
            done
            exit 1
          EOF
